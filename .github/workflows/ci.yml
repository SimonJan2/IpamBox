name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ipam
          POSTGRES_PASSWORD: ipam
          POSTGRES_DB: ipam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipam -d ipam"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ipam:ipam@localhost:5432/ipam
      REDIS_URL: redis://localhost:6379/0
      IPAMBOX_ALLOW_INSECURE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Lint (compileall)
        run: python -m compileall -q backend/app backend/alembic
      - name: Alembic upgrade head (clean DB)
        working-directory: backend
        run: alembic upgrade head
      - name: pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build (type-check + lint)
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
